<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Protected Page</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #4B0082;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #passwordScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #mainContent {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    input[type="password"] {
      padding: 10px;
      font-size: 18px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>

  <div id="passwordScreen">
    <h1>Enter Password</h1>
    <input type="password" id="passwordInput" placeholder="Password">
    <button onclick="checkPassword()">Submit</button>
    <p id="errorMessage" style="color: red; display: none;">Incorrect password. Try again.</p>
  </div>

  <div id="mainContent">
    <h1>🎉 Welcome to Bubba's Gramama!</h1>
    <!-- Your game buttons and content go here -->
    <p>This is where your full site content will appear after login.</p>
  </div>

  <script>
    const correctPassword = "bubba123"; // 🔑 Change this to your desired password

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("errorMessage");

      if (input === correctPassword) {
        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "flex";
      } else {
        error.style.display = "block";
      }
    }
  </script>

</body>
</html>
