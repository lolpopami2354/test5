<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bubba's Gramama</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #4B0082;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 2em;
      color: #fff;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin: 5px;
    }

    button:hover {
      background-color: #005a9e;
    }

    button.fullscreen {
      background-color: #444;
    }

    button.fullscreen:hover {
      background-color: #222;
    }

    #backButton {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      z-index: 1000;
    }

    iframe {
      width: 90%;
      max-width: 1200px;
      height: 600px;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      display: none;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <link rel="shortcut icon" type="image/x-icon" href="bubbasgramamaa.png" />

  <button id="backButton" onclick="goBack()">⬅ Back</button>
  <h1>WELCOME to Bubba's Gramama</h1>
  <img class="gif" src="https://media1.tenor.com/m/0IixRqy4QoEAAAAC/a-fart-fart.gif" alt="Funny gif">

  <div id="gameButtons">
    <h1>Stickman Golf</h1>
    <button onclick="showFrame('gameFrame7', 'https://gibbat2.github.io/Games/games/stickman-golf/')">Play</button>
    <button class="fullscreen" onclick="fullscreen('gameFrame7')">🔳 Fullscreen</button>

    <h1>Basketball Random</h1>
    <button onclick="showFrame('gameFrame6', 'https://gibbat2.github.io/Games/games/basketball-random/')">Play</button>
    <button class="fullscreen" onclick="fullscreen('gameFrame6')">🔳 Fullscreen</button>

    <h1>Minecraft</h1>
    <button onclick="showFrame('gameFrame5', 'https://daniezonmc.github.io/1.20/')">Play</button>
    <button class="fullscreen" onclick="fullscreen('gameFrame5')">🔳 Fullscreen</button>

    <h1>Drift Hunters</h1>
    <button onclick="showFrame('gameFrame4', 'https://gibbat2.github.io/Games/games/drifthunters/')">Play</button>
    <button class="fullscreen" onclick="fullscreen('gameFrame4')">🔳 Fullscreen</button>

    <h1>Drive Mad</h1>
    <button onclick="showFrame('gameFrame3', 'https://gibbat2.github.io/Games/games/drivemad/')">Play</button>
    <button class="fullscreen" onclick="fullscreen('gameFrame3')">🔳 Fullscreen</button>

    <h1>Opposite Day</h1>
    <button onclick="showFrame('gameFrame2', 'https://www.hoodamath.com/games/oppositeday.html')">Play</button>
    <button class="fullscreen" onclick="fullscreen('gameFrame2')">🔳 Fullscreen</button>

    <h1>❄️ Snow Rider 3D</h1>
    <button onclick="showFrame('gameFrame1', 'https://www.hoodamath.com/games/snowrider3d.html')">Play</button>
    <button class="fullscreen" onclick="fullscreen('gameFrame1')">🔳 Fullscreen</button>
  </div>

  <iframe id="gameFrame1" allowfullscreen></iframe>
  <iframe id="gameFrame2" allowfullscreen></iframe>
  <iframe id="gameFrame3" allowfullscreen></iframe>
  <iframe id="gameFrame4" allowfullscreen></iframe>
  <iframe id="gameFrame5" allowfullscreen></iframe>
  <iframe id="gameFrame6" allowfullscreen></iframe>
  <iframe id="gameFrame7" allowfullscreen></iframe>

  <script>
    function showFrame(frameId, url) {
      hideAllFrames();
      const iframe = document.getElementById(frameId);
      iframe.src = url;
      iframe.style.display = "block";
      document.getElementById("backButton").style.display = "inline-block";
    }

    function goBack() {
      hideAllFrames();
      document.getElementById("backButton").style.display = "none";
    }

    function hideAllFrames() {
      document.querySelectorAll("iframe").forEach(frame => {
        frame.style.display = "none";
        frame.src = "";
      });
    }

    function fullscreen(frameId) {
      const iframe = document.getElementById(frameId);
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }
  </script>
</body>
</html>
