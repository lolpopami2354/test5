<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubba's Gramama Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body {
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden; /* removes double scroll */
    font-family:'Orbitron',sans-serif;
    color:white;
    background:black;
  }

  /* Nebula & Star Background */
  .nebula {
    position:fixed;
    width:200%;
    height:200%;
    top:-50%;
    left:-50%;
    background:radial-gradient(circle at 30% 30%,rgba(89,0,255,0.3),transparent 70%),
               radial-gradient(circle at 70% 70%,rgba(0,255,255,0.3),transparent 70%);
    z-index:0;
    animation:nebulaMove 40s linear infinite;
  }
  @keyframes nebulaMove {
    from {transform:translate(0,0);}
    to {transform:translate(-25%,-25%);}
  }

  /* Shooting Stars */
  @keyframes shootStar {
    0% { transform: translateX(0) translateY(0); opacity:1; }
    100% { transform: translateX(600px) translateY(300px); opacity:0; }
  }
  .shooting-star {
    position:fixed;
    top:0; left:0;
    width:2px; height:80px;
    background:linear-gradient(180deg,white,rgba(255,255,255,0));
    border-radius:2px;
    opacity:0;
    pointer-events:none;
    z-index:1;
    animation:shootStar 2s linear infinite;
  }

  /* Layout */
  .content {
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    text-align:center;
  }
  h1 {font-size:2.2em;margin:10px 0;}
  .games {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:10px;
  }
  button {
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
    font-family:'Orbitron',sans-serif;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
  }
  button:hover {background:rgba(255,255,255,0.2);}
  iframe {
    width:1200px;
    max-width:95%;
    height:600px;
    border-radius:10px;
    border:2px solid rgba(255,255,255,0.06);
    box-shadow:0 10px 50px rgba(0,0,0,0.7);
    background:rgba(0,0,0,0.4);
    display:none;
    margin-top:20px;
    z-index:1;
  }

  /* Leaderboard & Admin Panel */
  .leaderboard,.admin-panel {
    margin-top:20px;
    background:rgba(0,0,0,0.5);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:10px;
    padding:10px;
    display:none;
  }
  table {width:100%;border-collapse:collapse;}
  th,td {border-bottom:1px solid rgba(255,255,255,0.1);padding:6px;}
  .danger-btn{background:rgba(255,0,0,0.3);}
  .small-btn{font-size:0.8em;padding:6px 10px;margin:2px;}
  .badge{margin-top:10px;font-size:1.1em;}
</style>
</head>
<body>
  <div class="nebula"></div>
  <div class="shooting-star" style="top:10%;left:5%;animation-delay:0s;"></div>
  <div class="shooting-star" style="top:30%;left:25%;animation-delay:1s;"></div>
  <div class="shooting-star" style="top:60%;left:45%;animation-delay:2s;"></div>
  <div class="shooting-star" style="top:80%;left:70%;animation-delay:3s;"></div>

  <div class="content">
    <h1 id="welcomeText">Welcome to Bubba's Gramama Hub</h1>
    <div class="badge" contenteditable="true" id="userBadge">🏅 New Player</div>

    <div class="games" id="gameButtons"></div>
    <iframe id="gameFrame"></iframe>

    <div style="margin-top:20px;">
      <button onclick="toggleLeaderboard()">🏆 Leaderboard</button>
      <button onclick="toggleAdmin()">⚙️ Admin</button>
      <button onclick="goBack()">⬅️ Back</button>
    </div>

    <div class="leaderboard" id="leaderboard"></div>

    <div class="admin-panel" id="adminPanel">
      <h3>Admin Panel</h3>
      <button class="small-btn" onclick="adminAddRow()">+ Add Row</button>
      <button class="small-btn" onclick="adminSave()">Save</button>
      <button class="small-btn danger-btn" onclick="adminResetAllTimes()">Reset All Times</button>
      <button class="small-btn danger-btn" onclick="adminResetAllCoins()">Reset All Coins</button>
      <div id="adminTable"></div>
    </div>
  </div>

<script>
const games = {
  'StealABrainRot': "https://lolpopami2354.github.io/StealABrainRot/",
  'hideandsmash': "https://gibbat2.github.io/Games/games/hideandsmash/",
  'pixelgun': "https://gibbat2.github.io/Games/games/pixelgun/",
  'idle-breakout': "https://gibbat2.github.io/Games/games/idle-breakout/",
  'crossyroad': "https://gibbat2.github.io/Games/games/crossyroad/",
  'slope': "https://gibbat2.github.io/Games/games/slope/",
  'bitlife': "https://gibbat2.github.io/Games/games/bitlife/",
  'subway-surfers': "https://gibbat2.github.io/Games/games/subway-surfers/",
  'stickman-golf': "https://gibbat2.github.io/Games/games/stickman-golf/",
  'basketball-random': "https://gibbat2.github.io/Games/games/basketball-random/",
  'minecraft': "https://daniezonmc.github.io/1.20/",
  'drifthunters': "https://gibbat2.github.io/Games/games/drifthunters/",
  'drivemad': "https://gibbat2.github.io/Games/games/drivemad/",
  'oppositeday': "https://www.hoodamath.com/games/oppositeday.html",
  'snowrider': "https://www.hoodamath.com/games/snowrider3d.html",
  'secret': "https://helios-blue.vercel.app/?sca_esv=fe0ebb4ec3b321c8&ie=ISO-8859-1&q=hello"
};

const nameKey = 'bubbaPlayerName';
const savedName = localStorage.getItem(nameKey);
if (!savedName) {
  const n = prompt("What's your name?");
  if (n) localStorage.setItem(nameKey, n);
}
const playerName = localStorage.getItem(nameKey) || 'Guest';
document.getElementById('welcomeText').innerText = `Welcome, ${playerName}!`;

const gameButtons = document.getElementById('gameButtons');
for (let g in games) {
  const btn = document.createElement('button');
  btn.textContent = g;
  btn.onclick = ()=>launchGame(games[g]);
  gameButtons.appendChild(btn);
}

const iframe = document.getElementById('gameFrame');
function launchGame(url){
  iframe.src = url;
  iframe.style.display = 'block';
  window.scrollTo(0,0);
}
function goBack(){
  iframe.src='';
  iframe.style.display='none';
}
function toggleLeaderboard(){
  const lb=document.getElementById('leaderboard');
  lb.style.display = lb.style.display==='block'?'none':'block';
  if(lb.style.display==='block'){lb.innerHTML='<h3>Leaderboard Coming Soon…</h3>';}
}
function toggleAdmin(){
  const ap=document.getElementById('adminPanel');
  ap.style.display = ap.style.display==='block'?'none':'block';
}

/* Placeholder Admin Functions */
function adminAddRow(){}
function adminSave(){}
function adminResetAllTimes(){}
function adminResetAllCoins(){}
</script>
</body>
</html>
