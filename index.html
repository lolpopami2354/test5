<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bubba's Gramama Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
      color: #00ff99;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 20px;
      font-size: 2.5em;
      color: #00ff99;
      text-shadow: 0 0 15px #00ff99;
    }
    iframe {
      width: 90%;
      height: 600px;
      margin: 20px auto;
      display: block;
      border: 2px solid #00ff99;
      border-radius: 12px;
      box-shadow: 0 0 25px #00ff99;
    }
    .button-container {
      margin: 20px;
    }
    button {
      background: linear-gradient(90deg, #00ff99, #0077ff);
      border: none;
      border-radius: 8px;
      color: black;
      padding: 12px 24px;
      margin: 8px;
      font-size: 1em;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 10px #00ff99;
    }
    button:hover {
      background: linear-gradient(90deg, #0077ff, #00ff99);
      box-shadow: 0 0 25px #00ff99;
      transform: scale(1.05);
    }
    #leaderboard, #adminPanel {
      background: rgba(0, 255, 153, 0.1);
      border: 1px solid #00ff99;
      border-radius: 10px;
      margin: 20px auto;
      width: 90%;
      max-width: 800px;
      padding: 15px;
      box-shadow: 0 0 15px #00ff99;
    }
    input[type="number"], input[type="password"] {
      font-family: 'Orbitron', sans-serif;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #00ff99;
      background: black;
      color: #00ff99;
      margin: 5px;
      text-align: center;
      width: 100px;
    }
    .small-btn {
      font-size: 0.8em;
      padding: 6px 12px;
    }
    .danger-btn {
      background: linear-gradient(90deg, #ff0044, #ff9900);
      box-shadow: 0 0 15px #ff0044;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🚀 Bubba's Gramama Hub 🚀</h1>
  <h3 id="welcomeMessage"></h3>

  <div class="button-container">
    <button onclick="launchGame('space')">Play Space Game</button>
    <button onclick="launchGame('clicker')">Play Clicker Game</button>
    <button onclick="launchGame('shooter')">Play Shooter Game</button>
  </div>

  <iframe id="gameFrame" src=""></iframe>

  <div id="leaderboard">
    <h2>🏆 Leaderboard 🏆</h2>
    <table id="leaderboardTable" style="width:100%; color:#00ff99; text-align:center;">
      <thead><tr><th>Name</th><th>Score</th><th>Coins</th></tr></thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>

  <div id="adminPanel">
    <h2>Admin Panel</h2>
    <p>Admin Code:</p>
    <input type="password" id="adminCode" placeholder="Enter code">
    <button onclick="checkAdmin()">Enter</button>
    <div id="adminActions" style="display:none; margin-top:10px;">
      <div class="admin-actions">
        <button class="small-btn" onclick="adminAddRow()">+ Add Row</button>
        <button class="small-btn" onclick="adminSave()">Save Changes</button>
        <button class="small-btn danger-btn" onclick="adminResetAllTimes()">Reset All Times</button>
        <button class="small-btn danger-btn" onclick="adminResetAllCoins()">Reset All Coins</button>
      </div>
    </div>
  </div>

  <div id="secretSection">
    <h2>Secret Launch Code Access</h2>
    <input type="number" id="secretCodeInput" placeholder="Enter Code">
    <button onclick="checkCode()">Unlock</button>
    <button id="unlockButton" style="display:none;">🚀 Launch Sequence Activated</button>
  </div>

  <script>
    // Load or create leaderboard
    let leaderboard = JSON.parse(localStorage.getItem('leaderboardData')) || [
      { name: 'Byr0n_TheKid', score: 999999, coins: 9999 },
      { name: 'Bubba', score: 5000, coins: 120 },
      { name: 'Gramama', score: 3200, coins: 85 }
    ];

    // Ask player name on first visit
    let playerName = localStorage.getItem('playerName');
    if (!playerName) {
      playerName = prompt("Welcome to Bubba's Gramama Hub! What's your name?");
      if (!playerName || playerName.trim() === "") playerName = "Guest";
      localStorage.setItem('playerName', playerName);
      alert(`Welcome, ${playerName}! Your progress will be saved.`);
    }
    document.getElementById("welcomeMessage").textContent = `👋 Welcome, ${playerName}!`;

    // Add player to leaderboard if not already listed
    if (!leaderboard.some(p => p.name === playerName)) {
      leaderboard.push({ name: playerName, score: 0, coins: 0 });
      localStorage.setItem('leaderboardData', JSON.stringify(leaderboard));
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard.forEach(p => {
        tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.score}</td><td>${p.coins}</td></tr>`;
      });
    }

    function launchGame(game) {
      const iframe = document.getElementById('gameFrame');
      if (game === 'space') iframe.src = 'spacegame.html';
      if (game === 'clicker') iframe.src = 'clickergame.html';
      if (game === 'shooter') iframe.src = 'shootergame.html';
      if (game === 'secret') iframe.src = 'secret.html';
    }

    // Secret Code Unlock
    function checkCode() {
      const code = document.getElementById('secretCodeInput').value;
      const unlockButton = document.getElementById('unlockButton');
      if (code === '2354') {
        unlockButton.style.display = 'inline-block';
        unlockButton.textContent = '🚀 Launch Sequence Activated';
      } else {
        alert('❌ Incorrect Code');
      }
    }

    // Launch secret game
    document.getElementById('unlockButton').addEventListener('click', function() {
      launchGame('secret');
      this.style.display = 'none';
    });

    // Admin Functions
    function checkAdmin() {
      const code = document.getElementById('adminCode').value;
      if (code === 'bubba2025') {
        document.getElementById('adminActions').style.display = 'block';
      } else {
        alert('Invalid admin code!');
      }
    }

    function adminAddRow() {
      const name = prompt("Enter player name:");
      const score = parseInt(prompt("Enter score:")) || 0;
      const coins = parseInt(prompt("Enter coins:")) || 0;
      leaderboard.push({ name, score, coins });
      renderLeaderboard();
    }

    function adminSave() {
      localStorage.setItem('leaderboardData', JSON.stringify(leaderboard));
      alert('✅ Leaderboard saved!');
    }

    function adminResetAllTimes() {
      leaderboard.forEach(p => p.score = 0);
      renderLeaderboard();
      alert('⏱️ All times reset!');
    }

    function adminResetAllCoins() {
      leaderboard.forEach(p => p.coins = 0);
      renderLeaderboard();
      alert('💰 All coins reset!');
    }

    renderLeaderboard();
  </script>
</body>
</html>
