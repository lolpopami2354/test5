<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    window.onload = function() {
      const win = window.open('about:blank', '_blank');
      if (win) {
        const iframe = win.document.createElement('iframe');
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "none";
        iframe.src = window.location.href; // Load this page inside the new tab
        win.document.body.style.margin = "0";
        win.document.body.appendChild(iframe);
        window.close(); // Close the original tab
      } else {
        document.body.innerHTML = "<h1 style='color:white; text-align:center;'>Popup blocked. Please allow popups and reload.</h1>";
        document.body.style.backgroundColor = "black";
      }
    };
  </script>
</head>
<body>
</body>
</html>
