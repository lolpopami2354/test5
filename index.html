<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bubba's Gramama</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #4B0082;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5em;
      color: #fff;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #0078D4;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-bottom: 10px;
    }

    button:hover {
      background-color: #005a9e;
    }

    #backButton {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      z-index: 9999;
    }

    #backButton:hover {
      background-color: #333;
    }

    .gameContainer {
      width: 1200px;
      height: 600px;
      display: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <button id="backButton" onclick="goBack()">⬅ Back</button>
  <h1>WELCOME to Bubba's Gramama</h1>
  <img src="https://media1.tenor.com/m/0IixRqy4QoEAAAAC/a-fart-fart.gif" alt="Funny gif">

  <center>
    <h1>Drive Mad!</h1>
    <button onclick="launchGame('gameFrame3', 'https://gibbat2.github.io/Games/games/drivemad/')">Play Drive Mad</button>
    <button onclick="fullscreenIframe('gameContainer3')">Fullscreen Drive Mad</button>

    <h1>Opposite Day</h1>
    <button onclick="launchGame('gameFrame2', 'https://www.hoodamath.com/games/oppositeday.html')">Don't play Opposite Day</button>
    <button onclick="fullscreenIframe('gameContainer2')">Fullscreen Opposite Day</button>

    <h1>❄️ Snow Rider 3D</h1>
    <button onclick="launchGame('gameFrame', 'https://www.hoodamath.com/games/snowrider3d.html')">Play Snow Rider 3D</button>
    <button onclick="fullscreenIframe('gameContainer')">Fullscreen Snow Rider</button>

    <div id="gameContainer" class="gameContainer">
      <iframe id="gameFrame" src="" allowfullscreen></iframe>
    </div>
    <div id="gameContainer2" class="gameContainer">
      <iframe id="gameFrame2" src="" allowfullscreen></iframe>
    </div>
    <div id="gameContainer3" class="gameContainer">
      <iframe id="gameFrame3" src="" allowfullscreen></iframe>
    </div>
  </center>

  <script>
    function goBack() {
      document.querySelectorAll('.gameContainer').forEach(c => c.style.display = 'none');
      document.getElementById("backButton").style.display = "none";
    }

    function launchGame(frameId, url) {
      document.querySelectorAll('.gameContainer').forEach(c => c.style.display = 'none');
      const iframe = document.getElementById(frameId);
      iframe.src = url;
      iframe.parentElement.style.display = "block";
      document.getElementById("backButton").style.display = "inline-block";
    }

    function fullscreenIframe(containerId) {
      const container = document.getElementById(containerId);
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else if (container.msRequestFullscreen) {
        container.msRequestFullscreen();
      }
    }
  </script>

</body>
</html>
